<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="#070a14" />
  <circle cx="256" cy="256" r="180" fill="url(#grad)" opacity="0.25" filter="url(#glow)" />
  <rect x="64" y="64" width="384" height="384" rx="96" fill="url(#grad)" />
  <!-- Musical Waves Symbol -->
  <g fill="#ffffff">
    <rect x="156" y="216" width="28" height="80" rx="14" />
    <rect x="206" y="156" width="28" height="200" rx="14" />
    <rect x="256" y="116" width="28" height="280" rx="14" />
    <rect x="306" y="176" width="28" height="160" rx="14" />
    <rect x="356" y="226" width="28" height="60" rx="14" />
  </g>
</svg>
